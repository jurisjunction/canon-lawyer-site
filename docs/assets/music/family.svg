<title id="ft-t">The household: the tracks as a family tree</title>
<desc id="ft-d">What Is to Be Done? quotes VIRI from Whether the Cloud Makes Many Worlds; TALEA from Whether the Cloud Makes Many Worlds. Brother Electron quotes VIRI from Whether the Cloud Makes Many Worlds; CARPENTER from What Is to Be Done?. A New Song quotes VIRI from Whether the Cloud Makes Many Worlds; TELEGRAPH from Whether the Cloud Makes Many Worlds; MOTETUS from What Is to Be Done?; CARPENTER from What Is to Be Done?; TRIPLUM from Brother Electron. On These Two Hang quotes VIRI from Whether the Cloud Makes Many Worlds; CARPENTER from What Is to Be Done?; TRIPLUM from Brother Electron; THINGS from A New Song. Every track hangs on On These Two Hang: it quotes every track before it, so through it each is kin to every other.</desc>
